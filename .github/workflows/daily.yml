name: Daily job search

# NOTE: this repo's root must be the `job-hunter/` folder (GitHub only reads
# workflows from <repo-root>/.github/workflows/).

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}    # manual "Run workflow" button

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Generous: fetching a few thousand company boards takes a while on the
    # first run. Steady-state daily runs are far quicker.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist seen.sqlite + feedback.jsonl across runs. A fresh key each run
      # saves a new cache; restore-keys pulls the most recent one back in.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data
          key: jobhunter-data-${{ github.run_id }}
          restore-keys: |
            jobhunter-data-

      - name: Write Google service-account key
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run pipeline
        env:
          # AI provider: set ANTHROPIC_API_KEY, or LLM_* for any
          # OpenAI-compatible provider (OpenRouter, Mistral, Groq, ...).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JOBHUNTER_SCORING_MODEL: ${{ vars.JOBHUNTER_SCORING_MODEL }}
          JOBHUNTER_GENERATION_MODEL: ${{ vars.JOBHUNTER_GENERATION_MODEL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY: ${{ vars.ADZUNA_COUNTRY }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: python -m jobhunter.pipeline

      - name: Clean up secret file
        if: always()
        run: rm -f service_account.json
