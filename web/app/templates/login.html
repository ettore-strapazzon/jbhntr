{% extends "base.html" %}
{% block title %}Log in — JBHNTR{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:0 auto">
  <h1>Log in</h1>
  {% for e in errors or [] %}<div class="notice err">{{ e }}</div>{% endfor %}

  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required value="{{ email or '' }}"
           autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <p><button type="submit">Log in</button></p>
  </form>

  {% if google_enabled %}
    <p class="small muted">or</p>
    <p><a class="btn ghost" href="/auth/google">Continue with Google</a></p>
  {% endif %}
  <p class="small">No account? <a href="/signup">Sign up free</a></p>
</div>
{% endblock %}
