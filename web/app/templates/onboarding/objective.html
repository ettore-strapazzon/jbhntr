{% extends "onboarding/_step.html" %}
{% block step %}
<p class="muted">Describe the role you actually want — in your own words, not job-board
  language. This is the single strongest signal the matcher has.</p>
<form method="post" action="/onboarding/save/objective">
  <label for="objective">What you're looking for</label>
  <textarea id="objective" name="objective" required style="min-height:200px"
    placeholder="e.g. A senior product role where I own the roadmap and work closely with engineering and design to ship things users love. Companies label this Senior Product Manager, Group PM, or Head of Product. Mid to senior level at startups or scale-ups.">{{ profile.objective }}</textarea>
  <p class="small muted">Include what you'd say no to — it filters as much as what you want.</p>
  <p><button type="submit">Save &amp; continue →</button></p>
</form>
{% endblock %}
