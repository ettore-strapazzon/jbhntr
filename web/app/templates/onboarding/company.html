{% extends "onboarding/_step.html" %}
{% block step %}
<p class="muted">What kind of employer, and in which sectors? Two identical job titles
  at differently-shaped companies are not the same job.</p>
<form method="post" action="/onboarding/save-lists/company">
  <label>Company type</label>
  <div class="checks">
    {% for o in company_options %}
      <label><input type="checkbox" name="company_type" value="{{ o }}"
        {% if o in profile.company_type %}checked{% endif %}> {{ o }}</label>
    {% endfor %}
  </div>

  <label>Sectors</label>
  <div class="checks">
    {% for o in vertical_options %}
      <label><input type="checkbox" name="verticals" value="{{ o }}"
        {% if o in profile.verticals %}checked{% endif %}> {{ o }}</label>
    {% endfor %}
  </div>
  <p><button type="submit">Save &amp; continue →</button></p>
</form>
{% endblock %}
