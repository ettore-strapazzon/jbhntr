{% extends "onboarding/_step.html" %}
{% block step %}
<p class="muted">What level are you targeting? Pick every level you'd genuinely consider —
  this filters out the biggest source of irrelevant results.</p>
<form method="post" action="/onboarding/save-lists/role">
  <label>Seniority</label>
  <div class="checks">
    {% for o in seniority_options %}
      <label><input type="checkbox" name="seniority" value="{{ o }}"
        {% if o in profile.seniority %}checked{% endif %}> {{ o }}</label>
    {% endfor %}
  </div>
  <p><button type="submit">Save &amp; continue →</button></p>
</form>
{% endblock %}
