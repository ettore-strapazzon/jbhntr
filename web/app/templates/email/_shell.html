<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light only">
<title>{% block subject %}JBHNTR{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#f6f4ef;-webkit-text-size-adjust:100%">

  <div style="display:none;max-height:0;overflow:hidden;opacity:0">{% block preheader %}{% endblock %}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background:#f6f4ef">
   <tr><td align="center" style="padding:32px 16px 40px">

    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
           style="width:600px;max-width:100%;background:#ffffff;border:1px solid #e0ddd6">

      <!-- brand band -->
      <tr><td style="background:#174b3e;padding:18px 32px">
        <span style="font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
                     letter-spacing:.18em;color:#ffffff">JBHNTR</span>
      </td></tr>

      <!-- body -->
      <tr><td style="padding:32px;font:400 16px/1.55 -apple-system,'Segoe UI',
        Helvetica,Arial,sans-serif;color:#1c1b19">
        {% block content %}{% endblock %}
      </td></tr>

      <!-- in-card links -->
      <tr><td style="border-top:1px solid #ece9e3;padding:16px 32px;
        font:400 13px/1.5 Helvetica,Arial,sans-serif">
        <a href="{{ base_url }}/account" style="color:#174b3e">Email settings</a> ·
        <a href="{{ base_url }}/privacy" style="color:#174b3e">Privacy</a> ·
        <a href="mailto:{{ support_email }}" style="color:#174b3e">Reply to a human</a>
      </td></tr>
    </table>

    <!-- outside the card -->
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
           style="width:600px;max-width:100%">
     <tr><td style="padding:16px 8px 0;text-align:center;
       font:400 12px/1.5 Helvetica,Arial,sans-serif;color:#8a8780">
       JBHNTR · An AI job-search agent that reads the market for you.<br>
       {% if config.postal_address %}{{ config.postal_address }}<br>{% endif %}
       {% if unsub_url %}<a href="{{ unsub_url }}" style="color:#8a8780">Unsubscribe</a>{% endif %}
     </td></tr>
    </table>

   </td></tr>
  </table>
</body></html>
