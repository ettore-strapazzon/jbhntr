<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light only">
<title>{% block subject %}JBHNTR{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#FBF8F2;-webkit-text-size-adjust:100%">

  <div style="display:none;max-height:0;overflow:hidden;opacity:0">{% block preheader %}{% endblock %}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background:#FBF8F2">
   <tr><td align="center" style="padding:32px 16px 40px">

    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
           style="width:600px;max-width:100%;background:#FFFFFF;border:1px solid #D8DFE5">

      <!-- brand band -->
      <tr><td style="background:#17334B;padding:18px 24px">
        <span style="font:800 20px/1 'Plus Jakarta Sans',Arial,sans-serif;
                     letter-spacing:-.01em;color:#FFFFFF">JBHNTR</span>
      </td></tr>

      <!-- body -->
      <tr><td style="padding:24px 32px;font:400 16px/24px 'DM Sans',Arial,sans-serif;color:#17334B">
        {% block content %}{% endblock %}
      </td></tr>

      <!-- in-card links -->
      <tr><td style="border-top:1px solid #D8DFE5;padding:16px 32px;
        font:400 13px/1.5 'DM Sans',Arial,sans-serif">
        <a href="{{ base_url }}/account" style="color:#17334B">Email settings</a> ·
        <a href="{{ base_url }}/privacy" style="color:#17334B">Privacy</a> ·
        <a href="mailto:{{ support_email }}" style="color:#17334B">Reply to a human</a>
      </td></tr>
    </table>

    <!-- outside the card -->
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
           style="width:600px;max-width:100%">
     <tr><td style="padding:16px 8px 0;text-align:center;
       font:400 12px/1.5 'DM Sans',Arial,sans-serif;color:#526273">
       JBHNTR · An AI job-search agent that reads the market for you.<br>
       {% if config.postal_address %}{{ config.postal_address }}<br>{% endif %}
       {% if unsub_url %}<a href="{{ unsub_url }}" style="color:#526273">Unsubscribe</a>{% endif %}
     </td></tr>
    </table>

   </td></tr>
  </table>
</body></html>
