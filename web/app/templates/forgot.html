{% extends "base.html" %}
{% block title %}Reset your password · JBHNTR{% endblock %}
{% block content %}
<div class="card authcard">
  <h1>Reset your password</h1>
  {% if sent %}
    <div class="notice ok" role="status">{{ sent }}</div>
    <p class="small"><a href="/login">Back to log in</a></p>
  {% else %}
    <p class="muted">Enter your email and we'll send a link to set a new password.</p>
    <form method="post" action="/forgot">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email">
      <p><button type="submit">Send reset link</button></p>
    </form>
    <p class="small"><a href="/login">Back to log in</a></p>
  {% endif %}
</div>
{% endblock %}
