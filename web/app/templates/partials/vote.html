{# 1-5 match rating with an optional reason (R9). Swapped in place by HTMX so a
   rating never reloads the page. rating_labels is a template global. #}
<div id="vote-{{ r.id }}" class="rate">
  <form hx-post="/feedback/{{ r.id }}" hx-target="#vote-{{ r.id }}" hx-swap="outerHTML"
        method="post" action="/feedback/{{ r.id }}">
    <fieldset>
      <legend class="small muted">How good a match is this?</legend>
      <div class="ratebtns">
        {% for n, label in rating_labels %}
          <button type="submit" name="rating" value="{{ n }}"
            class="ratebtn{% if fb and fb.rating == n %} on{% endif %}"
            aria-pressed="{{ 'true' if fb and fb.rating == n else 'false' }}">
            <span class="n">{{ n }}</span><span class="l">{{ label }}</span>
          </button>
        {% endfor %}
      </div>
    </fieldset>
    {% if fb and fb.rating %}
      <div class="ratenote">
        <input type="hidden" name="rating" value="{{ fb.rating }}">
        <label for="note-{{ r.id }}" class="small">
          {% if fb.rating <= 3 %}What was wrong with it?{% else %}What made it good?{% endif %}
          <span class="muted">optional, one line</span></label>
        <input id="note-{{ r.id }}" type="text" name="note" value="{{ fb.note or '' }}"
          maxlength="{{ config.max_feedback_chars }}"
          placeholder="{% if fb.rating <= 3 %}too junior, wrong city, not really a product role{% else %}right level, right sector, team size fits{% endif %}">
        <button type="submit" class="ghost">Save</button>
        <span class="thanks" role="status">Saved. The next search weighs this.</span>
      </div>
    {% endif %}
  </form>
</div>
